name: supabase-keepalive

# Keeps free-tier Supabase from pausing after 7 days of inactivity.
# Hits Auth + PostgREST roots — both count as API activity, no RLS needed.
# Manual run: Actions → supabase-keepalive → Run workflow

on:
  schedule:
    - cron: '0 9 */3 * *' # 09:00 UTC every 3 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (keepalive)
        run: |
          set -e
          echo "Pinging ${SUPABASE_URL} ..."

          # 1) Auth health — always 200, no RLS. Counts as API activity.
          AUTH_URL="${SUPABASE_URL}/auth/v1/health"
          echo "→ GET $AUTH_URL"
          HTTP_AUTH=$(curl -s -o /tmp/auth.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "$AUTH_URL" || echo "000")
          echo "  auth health HTTP $HTTP_AUTH"
          cat /tmp/auth.json 2>/dev/null | head -c 300; echo ""

          # 2) PostgREST root — hits DB, no table RLS. Counts as DB activity.
          REST_URL="${SUPABASE_URL}/rest/v1/"
          echo "→ GET $REST_URL"
          HTTP_REST=$(curl -s -o /tmp/rest.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "$REST_URL" || echo "000")
          echo "  rest root HTTP $HTTP_REST"
          cat /tmp/rest.json 2>/dev/null | head -c 300; echo ""

          # 3) Optional: if you added SUPABASE_SERVICE_ROLE_KEY secret, also try a real DB read
          #    (shows is readable by authenticated; with service_role + FORCE RLS it may still 401 — ignore)
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "→ GET user_shows with service_role (optional)"
            HTTP_DB=$(curl -s -o /tmp/db.json -w "%{http_code}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/user_shows?select=show_id&limit=1" || echo "000")
            echo "  db HTTP $HTTP_DB"
            cat /tmp/db.json 2>/dev/null | head -c 300; echo ""
          fi

          # Success if either auth or rest got 2xx-4xx (any API hit resets the 7-day timer)
          # 401 on table RLS is expected and still counts as API hit — we treat 2xx-4xx as ok
          SUCCESS=0
          if [ "$HTTP_AUTH" -ge 200 ] && [ "$HTTP_AUTH" -lt 500 ]; then SUCCESS=1; fi
          if [ "$HTTP_REST" -ge 200 ] && [ "$HTTP_REST" -lt 500 ]; then SUCCESS=1; fi

          if [ "$SUCCESS" -eq 1 ]; then
            echo "✓ keepalive ok — API hit counted, 7-day timer reset"
          else
            echo "::error::keepalive failed — no API endpoint responded (AUTH $HTTP_AUTH, REST $HTTP_REST)"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
